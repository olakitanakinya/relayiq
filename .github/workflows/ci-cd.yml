name: CI/CD

on:
  workflow_run:
    workflows: ["Syntax Check All Scripts and YAML"]
    types:
      - completed

jobs:
  build-backend:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v2

      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/relayiq-backend:latest backend
      - run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/relayiq-backend:latest

