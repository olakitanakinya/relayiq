---
name: CI/CD to Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:   # <-- Allows manual trigger

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/relayiq-backend:latest \
            ./backend
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/relayiq-backend:latest

      - name: Build and Push Frontend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/relayiq-frontend:latest \
            ./frontend
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/relayiq-frontend:latest

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Cluster
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml
