---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: <DOCKERHUB_USERNAME>/relayiq-backend:latest  # Replace
          ports:
            - containerPort: 4000
